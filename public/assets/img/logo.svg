<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 60" width="100%" height="100%">
  <defs>
    <!-- Branding Gradients -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <!-- Soft glow/shadow for 3D premium effect -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0072ff" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Dynamic Overlapping Geometric Icon -->
  <circle cx="20" cy="24" r="16" fill="url(#grad1)" opacity="0.9"/>
  <circle cx="34" cy="34" r="16" fill="url(#grad2)" filter="url(#shadow)"/>
  
  <!-- Center Checkmark showing success/finance approval -->
  <path d="M 28 34 L 32 38 L 40 28" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Striking Modern Typography -->
  <text x="65" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-1">
    <tspan fill="#1e293b">SISTEMA</tspan>
    <tspan fill="url(#textGrad)"> PRÉSTAMO</tspan>
  </text>
</svg>
